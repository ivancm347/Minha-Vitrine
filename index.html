<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vitrine Oficial • Ivan Melo</title>
<meta name="description" content="Vitrine Oficial Ivan Melo - Compra direta na loja oficial">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
.scrollbar-hide::-webkit-scrollbar{display:none}.scrollbar-hide{-ms-overflow-style:none;scrollbar-width:none}
.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
</style>
</head>
<body class="bg-[#f8fafc] text-gray-900">
<header class="sticky top-0 z-40 bg-white border-b shadow-sm">
  <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-2">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 bg-gray-900 text-white rounded-xl flex items-center justify-center font-black">IM</div>
      <div>
        <h1 class="font-black text-lg leading-none">Vitrine Oficial • Ivan Melo</h1>
        <p class="text-xs text-gray-500">Compra direta • 15 produtos</p>
      </div>
    </div>
    <div class="text-xs bg-gray-100 px-3 py-2 rounded-full text-center">🛒 Compra direta na loja oficial • 💬 Dúvidas? Chame no Zap <b>(11) 97698-3978</b></div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <div class="mb-5 flex flex-col md:flex-row gap-3">
    <div class="flex-1 relative">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
      <input id="busca" placeholder="Buscar por nome, marca, categoria..." class="w-full pl-11 pr-4 py-3 rounded-2xl border bg-white focus:outline-none focus:ring-2 focus:ring-black shadow-sm">
    </div>
    <div id="filtros" class="flex gap-2 overflow-x-auto scrollbar-hide pb-1 items-center"></div>
  </div>

  <section id="destaques-section" class="mb-8 hidden">
    <h2 class="font-black text-lg mb-3">🔥 Ofertas em destaque</h2>
    <div id="destaques" class="flex gap-4 overflow-x-auto scrollbar-hide snap-x snap-mandatory pb-2"></div>
  </section>

  <div id="status" class="text-center py-16">
    <div class="inline-block animate-spin rounded-full h-8 w-8 border-2 border-black border-t-transparent mb-3"></div>
    <p class="text-gray-500">Carregando produtos...</p>
  </div>
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
</main>

<a href="https://wa.me/5511976983978?text=Ol%C3%A1%20Ivan%2C%20vim%20pela%20sua%20vitrine" target="_blank" class="fixed bottom-5 right-5 w-14 h-14 bg-[#25D366] text-white rounded-full flex items-center justify-center shadow-xl text-2xl z-50 hover:scale-105 transition"><i class="fa-brands fa-whatsapp"></i></a>

<div id="videoModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[60] p-4">
  <div class="bg-white rounded-2xl max-w-2xl w-full overflow-hidden shadow-2xl">
    <div class="flex justify-between items-center p-4 border-b"><span class="font-bold">Vídeo do produto</span><button onclick="fecharVideo()" class="w-8 h-8 bg-gray-100 rounded-full">✕</button></div>
    <video id="modalVideo" controls playsinline class="w-full max-h-[70vh] bg-black"></video>
  </div>
</div>

<script>
let produtos = [];
let categoriaAtiva = 'Todos';

async function carregar(){
  const status = document.getElementById('status');
  try{
    let res = await fetch('produtos.json', {cache:'no-store'});
    if(!res.ok) res = await fetch('./produtos.json', {cache:'no-store'});
    if(!res.ok) throw new Error('produtos.json não encontrado na raiz');
    produtos = await res.json();
    if(!Array.isArray(produtos)) throw new Error('produtos.json não é uma lista');
    status.style.display='none';
    renderFiltros();
    render();
  }catch(e){
    status.innerHTML = `<div class="bg-red-50 border border-red-200 p-5 rounded-2xl text-left max-w-xl mx-auto"><b>⚠️ Não foi possível carregar produtos.json</b><br><span class="text-sm">${e.message}</span><br><br><span class="text-xs text-gray-500">Verifique se o arquivo produtos.json está na raiz do repositório ivancm347/Minha-Vitrine no GitHub e aguarde 1 minuto após o commit.</span></div>`;
  }
}

function renderFiltros(){
  const cats = ['Todos', ...new Set(produtos.map(p=>p.categoria).filter(Boolean))];
  const cont = document.getElementById('filtros');
  cont.innerHTML = cats.map(c=>{
    const count = c==='Todos' ? produtos.length : produtos.filter(p=>p.categoria===c).length;
    const active = c===categoriaAtiva ? 'bg-black text-white border-black' : 'bg-white border-gray-200';
    return `<button onclick="filtrarCategoria('${c.replace(/'/g, "\'")}')" data-cat="${c}" class="cat-btn whitespace-nowrap px-4 py-2.5 rounded-full text-sm font-bold border ${active} shadow-sm">${c} <span class="opacity-60 ml-1">${count}</span></button>`;
  }).join('');
}

function filtrarCategoria(c){
  categoriaAtiva=c;
  renderFiltros();
  render();
}

document.getElementById('busca').addEventListener('input', render);

function getFiltrados(){
  const q = document.getElementById('busca').value.toLowerCase().trim();
  return produtos.filter(p=>{
    const catOk = categoriaAtiva==='Todos' || p.categoria===categoriaAtiva;
    if(!q) return catOk;
    const texto = `${p.nome} ${p.categoria} ${p.marca||''} ${p.descricao||''} ${p.badge||''}`.toLowerCase();
    return catOk && texto.includes(q);
  });
}

function imgOnError(img){
  const orig = img.getAttribute('data-original') || img.src;
  if(!img.dataset.triedGithub && orig.startsWith('imagens/')){
    img.dataset.triedGithub='1';
    img.src = 'https://ivancm347.github.io/Minha-Vitrine/' + orig;
    return;
  }
  img.style.display='none';
  const ph = img.parentElement.querySelector('.img-fallback');
  if(ph) ph.style.display='flex';
}

function formatPreco(v){ 
  const n = Number(v);
  if(isNaN(n)) return v;
  return 'R$ ' + n.toFixed(2).replace('.',','); 
}

function cardDestaque(p){
  return `<div class="min-w-[300px] snap-start bg-white rounded-2xl border shadow-sm p-3 flex gap-3 hover:shadow-md transition">
    <div class="relative w-20 h-20 flex-shrink-0">
      <img src="${p.imagem}" data-original="${p.imagem}" loading="lazy" onerror="imgOnError(this)" class="w-20 h-20 object-cover rounded-xl bg-gray-50">
      <div class="img-fallback hidden w-20 h-20 bg-gray-100 rounded-xl items-center justify-center text-[9px] text-center p-1">SEM FOTO</div>
    </div>
    <div class="flex-1 min-w-0">
      <div class="text-[9px] bg-black text-white px-2 py-0.5 rounded-full inline-block mb-1 font-bold">${(p.badge||p.categoria||'').toUpperCase()}</div>
      <div class="text-[13px] font-bold line-clamp-2 leading-tight">${p.nome}</div>
      <div class="text-green-600 font-black text-sm mt-1">${formatPreco(p.preco)}</div>
    </div>
  </div>`;
}

function card(p){
  const temVideo = p.video && String(p.video).trim() !== '';
  const shopee = p.links?.shopee;
  const ml = p.links?.mercado_livre;
  const tiktok = p.links?.tiktok;
  const precoDe = (p.preco_de && Number(p.preco_de)>0 && Number(p.preco_de)!==Number(p.preco)) ? `<span class="text-xs text-gray-400 line-through mr-2">${formatPreco(p.preco_de)}</span>` : '';
  const whatsMsg = encodeURIComponent(`Olá, tenho interesse no ${p.nome} (${p.id})`);
  const whatsNum = (p.whatsapp||'5511976983978').replace(/\D/g,'');
  return `<div class="bg-white rounded-[20px] border overflow-hidden flex flex-col hover:shadow-lg transition shadow-sm">
    <div class="relative bg-gray-50">
      <img src="${p.imagem}" data-original="${p.imagem}" alt="${(p.imagem_alt||p.nome).replace(/"/g,'')}" loading="lazy" onerror="imgOnError(this)" class="w-full h-60 object-cover">
      <div class="img-fallback hidden w-full h-60 bg-gray-100 items-center justify-center flex-col text-center p-4">
        <i class="fa-regular fa-image text-3xl mb-2 text-gray-400"></i>
        <span class="text-xs font-black">IMAGEM LOCAL NÃO ENCONTRADA</span>
        <span class="text-[10px] mt-1">Suba a pasta imagens/ no GitHub</span>
        <span class="text-[9px] mt-1 opacity-50 break-all">${p.imagem}</span>
      </div>
      ${p.badge?`<span class="absolute top-3 left-3 bg-black text-white text-[10px] font-black px-3 py-1 rounded-full shadow">${p.badge}</span>`:''}
      <span class="absolute top-3 right-3 w-3 h-3 bg-green-500 rounded-full border-2 border-white shadow"></span>
    </div>
    <div class="p-4 flex-1 flex flex-col">
      <div class="flex items-center gap-1 text-[11px] text-amber-500 mb-1"><i class="fa-solid fa-star"></i> ${p.avaliacao||4.8} • ${p.categoria||''}</div>
      <h3 class="font-bold text-[14px] leading-tight line-clamp-2 min-h-[40px]">${p.nome}</h3>
      <div class="mt-2 mb-2">${precoDe}<span class="font-black text-[#16a34a] text-[16px]">${formatPreco(p.preco)}</span></div>
      <p class="text-[11px] text-gray-500 line-clamp-2 mb-3 min-h-[32px]">${p.descricao||''}</p>
      ${temVideo?`<button onclick="abrirVideo('${p.video}')" class="mb-3 w-full text-xs border border-gray-200 hover:bg-gray-50 rounded-full py-2 font-bold"><i class="fa-solid fa-play mr-1"></i> Ver Vídeo</button>`:''}
      <div class="mt-auto grid grid-cols-1 gap-2">
        ${shopee?`<a href="${shopee}" target="_blank" rel="noopener" class="text-center bg-[#EE4D2D] hover:brightness-110 text-white text-xs font-black py-3 rounded-full transition">Comprar na Shopee</a>`:''}
        ${ml?`<a href="${ml}" target="_blank" rel="noopener" class="text-center bg-[#FFE600] hover:brightness-95 text-black text-xs font-black py-3 rounded-full transition">Ver no Mercado Livre</a>`:''}
        ${tiktok?`<a href="${tiktok}" target="_blank" rel="noopener" class="text-center bg-black hover:bg-zinc-800 text-white text-xs font-black py-3 rounded-full transition">TikTok Shop</a>`:''}
        <a href="https://wa.me/${whatsNum}?text=${whatsMsg}" target="_blank" rel="noopener" class="text-center bg-[#25D366] hover:brightness-110 text-white text-xs font-black py-3 rounded-full transition"><i class="fa-brands fa-whatsapp mr-1"></i> WhatsApp</a>
      </div>
      <div class="mt-3 text-[10px] text-gray-400 truncate">ID: ${p.id}</div>
    </div>
  </div>`;
}

function render(){
  const lista = getFiltrados();
  const grid = document.getElementById('grid');
  const destSec = document.getElementById('destaques-section');
  const dest = document.getElementById('destaques');
  
  const destaques = produtos.filter(p=>p.destaque);
  const destaquesFiltrados = lista.filter(p=>p.destaque);
  
  if(destaquesFiltrados.length>0){
    destSec.classList.remove('hidden');
    dest.innerHTML = destaquesFiltrados.map(cardDestaque).join('');
  } else {
    destSec.classList.add('hidden');
  }

  grid.innerHTML = lista.map(card).join('');
  if(!lista.length){
    grid.innerHTML = '<div class="col-span-full text-center py-16 text-gray-400"><i class="fa-regular fa-face-frown text-3xl mb-2"></i><br>Nenhum produto encontrado</div>';
  }
}

function abrirVideo(src){
  const m=document.getElementById('videoModal');
  const v=document.getElementById('modalVideo');
  v.removeAttribute('data-tried');
  v.src=src;
  v.onerror=()=>{
    if(!v.dataset.tried){
      v.dataset.tried='1';
      v.src='https://ivancm347.github.io/Minha-Vitrine/'+src;
    } else {
      alert('Vídeo não encontrado. Verifique se a pasta videos/ foi enviada ao GitHub.');
      fecharVideo();
    }
  };
  m.classList.remove('hidden'); m.classList.add('flex');
  v.play().catch(()=>{});
}
function fecharVideo(){
  const m=document.getElementById('videoModal');
  const v=document.getElementById('modalVideo');
  v.pause(); v.removeAttribute('src'); v.load(); v.dataset.tried='';
  m.classList.add('hidden'); m.classList.remove('flex');
}
document.getElementById('videoModal').addEventListener('click', (e)=>{ if(e.target.id==='videoModal') fecharVideo(); });

carregar();
</script>
</body>
</html>
