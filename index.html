<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vitrine Ivan C Melo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}
.banner{background:#ffe600;color:#000;text-align:center;padding:10px;font-weight:800;font-size:13px}
.header{background:linear-gradient(90deg,#fe2c55,#25f4ee);padding:24px;text-align:center}
.header h1{font-size:clamp(20px,4vw,32px)}
.header p{margin-top:6px;font-size:13px}
.wrap{max-width:1240px;margin:auto;padding:16px}
.toolbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.search{flex:1;min-width:220px;background:#151515;border:1px solid #333;border-radius:9px;padding:11px 13px;color:#fff;outline:none}
select{background:#151515;border:1px solid #333;border-radius:9px;padding:11px;color:#fff}
.status{background:#151515;border:1px solid #222;border-radius:10px;padding:10px;margin-bottom:14px;color:#aaa;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:#151515;border:1px solid #252525;border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:220px;background:#fff;display:flex;align-items:center;justify-content:center;position:relative;padding:12px}
.thumb img{max-width:90%;max-height:90%;object-fit:contain}
.badge{position:absolute;top:9px;left:9px;background:#fe2c55;color:#fff;padding:5px 10px;border-radius:999px;font-size:10px;font-weight:800}
.info{padding:13px;display:flex;flex-direction:column;flex:1}
.cat{color:#888;font-size:10px;margin-bottom:5px}
.nome{font-weight:800;font-size:14px;line-height:1.3;min-height:54px}
.desc{color:#aaa;font-size:11px;line-height:1.4;margin:7px 0}
.preco{color:#25f4ee;font-weight:900;font-size:21px;margin-top:auto;padding-top:8px}
.btn{display:block;text-align:center;padding:10px;border-radius:8px;text-decoration:none;font-weight:800;margin-top:7px;font-size:12px}
.tk{background:#fe2c55;color:#fff}.sp{background:#ff5b00;color:#fff}.ml{background:#ffe600;color:#000}.zp{background:#25d366;color:#fff}
.empty,.error{background:#151515;border:1px solid #333;border-radius:12px;padding:35px;text-align:center;color:#aaa;grid-column:1/-1}
.error{border-color:#fe2c55;color:#fff}
.whatsapp{position:fixed;right:16px;bottom:16px;background:#25d366;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;text-decoration:none;box-shadow:0 4px 18px #0008}
</style>
</head>
<body>
<div class="banner">CUPOM IVAN10 | ML WPNN5W-3R8V | ZAP (11) 97698-3978</div>
<header class="header">
<h1>VITRINE OFICIAL IVAN C MELO</h1>
<p id="summary">Carregando produtos...</p>
</header>
<main class="wrap">
<div class="toolbar">
<input id="search" class="search" type="search" placeholder="Buscar produto..." autocomplete="off">
<select id="category"><option value="">Todas as categorias</option></select>
</div>
<div id="status" class="status">Fonte dos produtos: produtos.json</div>
<section id="grid" class="grid"></section>
</main>
<a class="whatsapp" href="https://wa.me/5511976983978?text=Ola%20Ivan!%20Vi%20um%20produto%20na%20vitrine." target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>

<script>
"use strict";
let produtos=[];

const $=id=>document.getElementById(id);

function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}

function normalizeProduct(p,index){
  const links=p.links||{};
  return {
    id:p.id||`produto_${index+1}`,
    nome:p.nome||"Produto sem nome",
    preco:p.preco||"",
    categoria:p.categoria||"Sem categoria",
    badge:p.badge||"",
    descricao:p.descricao||"",
    imagem:p.imagem||p.imagem_transparente||"",
    links:{
      tiktok:links.tiktok||p.link_afiliado||p.link||"",
      shopee:links.shopee||"",
      mercado_livre:links.mercado_livre||p.mercado_livre||""
    }
  };
}

function whatsappLink(nome){
  return "https://wa.me/5511976983978?text="+encodeURIComponent("Ola Ivan! Vi "+nome+" na sua vitrine.");
}

function render(){
  const q=$("search").value.trim().toLowerCase();
  const cat=$("category").value;
  const list=produtos.filter(p=>{
    const text=(p.nome+" "+p.descricao+" "+p.categoria).toLowerCase();
    return (!q||text.includes(q))&&(!cat||p.categoria===cat);
  });

  $("summary").textContent=`${produtos.length} produtos - Zap (11) 97698-3978`;
  $("status").textContent=`Mostrando ${list.length} de ${produtos.length} produtos • Fonte: produtos.json`;
  $("grid").innerHTML="";

  if(!list.length){
    $("grid").innerHTML='<div class="empty"><h3>Nenhum produto encontrado</h3><p style="margin-top:8px">Tente outra busca ou categoria.</p></div>';
    return;
  }

  list.forEach(p=>{
    const card=document.createElement("article");
    card.className="card";

    const thumb=document.createElement("div");
    thumb.className="thumb";
    if(p.badge){
      const badge=document.createElement("span");
      badge.className="badge";
      badge.textContent=p.badge;
      thumb.appendChild(badge);
    }
    if(p.imagem){
      const img=document.createElement("img");
      img.src="./"+p.imagem;
      img.alt=p.nome;
      img.onerror=()=>img.remove();
      thumb.appendChild(img);
    }

    const info=document.createElement("div");
    info.className="info";
    info.innerHTML=`
      <div class="cat">${escapeHTML(p.categoria)}</div>
      <div class="nome">${escapeHTML(p.nome)}</div>
      ${p.descricao?`<div class="desc">${escapeHTML(p.descricao)}</div>`:""}
      <div class="preco">${escapeHTML(p.preco||"Preço não informado")}</div>
    `;

    const addBtn=(url,label,cls)=>{
      if(!url)return;
      const a=document.createElement("a");
      a.className=`btn ${cls}`;
      a.href=url;
      a.target="_blank";
      a.rel="noopener sponsored";
      a.textContent=label;
      info.appendChild(a);
    };
    addBtn(p.links.tiktok,"TikTok Shop","tk");
    addBtn(p.links.shopee,"Shopee","sp");
    addBtn(p.links.mercado_livre,"Mercado Livre","ml");
    addBtn(whatsappLink(p.nome),"WhatsApp","zp");

    card.append(thumb,info);
    $("grid").appendChild(card);
  });
}

function populateCategories(){
  const cats=[...new Set(produtos.map(p=>p.categoria).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
  $("category").innerHTML='<option value="">Todas as categorias</option>'+
    cats.map(c=>`<option value="${escapeHTML(c)}">${escapeHTML(c)}</option>`).join("");
}

async function loadProducts(){
  try{
    const response=await fetch("./produtos.json",{cache:"no-store"});
    if(!response.ok) throw new Error(`HTTP ${response.status}`);
    const data=await response.json();
    if(!Array.isArray(data)) throw new Error("produtos.json precisa conter um array.");
    produtos=data.map(normalizeProduct);
    populateCategories();
    render();
  }catch(error){
    console.error(error);
    $("summary").textContent="Não foi possível carregar os produtos";
    $("status").textContent="Erro ao ler produtos.json";
    $("grid").innerHTML=`
      <div class="error">
        <h3>⚠️ Não foi possível carregar produtos.json</h3>
        <p style="margin-top:10px">Confirme se o arquivo <b>produtos.json</b> está na mesma pasta deste index.html.</p>
        <p style="margin-top:7px;font-size:11px;color:#aaa">Se estiver testando com duplo clique (file://), publique a pasta em um servidor/GitHub Pages ou use um servidor local.</p>
      </div>`;
  }
}

$("search").addEventListener("input",render);
$("category").addEventListener("change",render);
loadProducts();
</script>
</body>
</html>
